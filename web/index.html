<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이렌 알림</title>
  <style>
    :root {
      --bg: #f6f6f3; --card: #fff; --ink: #1c1f1d; --muted: #6a716d; --rule: #dcdfda;
      --alert: #c8281e; --ok: #2f7a5a;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121413; --card: #1b1e1c; --ink: #e8ebe8; --muted: #9aa29e; --rule: #2e3330; --alert: #ff5a4e; --ok: #5fbf93; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 24px; }
    #status { font-size: 13px; color: var(--muted); white-space: nowrap; }
    #status::before { content: "●"; margin-right: 6px; color: var(--muted); }
    #status.on::before { color: var(--ok); }
    #status.off::before { color: var(--alert); }
    .card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
    #arm { width: 100%; font: inherit; font-weight: 600; padding: 14px; border-radius: 10px; cursor: pointer;
      border: 0; background: var(--ink); color: var(--bg); }
    #arm[aria-pressed="true"] { background: var(--ok); color: #fff; }
    .hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
    li:first-child { border-top: 0; }
    li .meta { color: var(--muted); font-size: 13px; }
    #empty { color: var(--muted); margin: 0; }
    #error { color: var(--alert); margin: 0; }

    /* 알림 화면: 1초에 한 번 깜빡인다 (초당 3회 이하, WCAG 2.3.1). 움직임 줄이기 설정이면 깜빡이지 않는다 */
    #overlay { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center;
      align-items: center; gap: 16px; padding: 24px; text-align: center; background: var(--alert); color: #fff; }
    #overlay.show { display: flex; animation: flash 1s steps(2, jump-none) infinite; }
    @keyframes flash { 50% { background: #7a1610; } }
    @media (prefers-reduced-motion: reduce) { #overlay.show { animation: none; } }
    #overlay .big { font-size: clamp(40px, 12vw, 72px); font-weight: 800; line-height: 1.1; }
    #overlay p { margin: 0; font-size: 18px; }
    #ack { font: inherit; font-size: 20px; font-weight: 700; padding: 14px 40px; border-radius: 999px;
      border: 2px solid #fff; background: transparent; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>사이렌 알림</h1>
      <span id="status" role="status">연결 중</span>
    </header>

    <section class="card">
      <button id="arm" type="button" aria-pressed="false">알림 켜기</button>
      <p class="hint">한 번 눌러 두면 사이렌이 감지될 때 화면이 깜빡이고 휴대폰이 진동합니다 (진동은 Android만). 화면은 켜진 채로 둡니다.</p>
    </section>

    <section class="card">
      <h2>최근 감지</h2>
      <p id="error" hidden></p>
      <p id="empty">아직 감지된 사이렌이 없습니다.</p>
      <ol id="history"></ol>
    </section>
  </main>

  <div id="overlay" role="alertdialog" aria-labelledby="ov-title" aria-describedby="ov-desc">
    <div class="big" id="ov-title">사이렌 감지</div>
    <p id="ov-desc">주변에 구급차·소방차가 있거나 비상 상황일 수 있습니다. 주위를 확인하세요.</p>
    <p id="ov-meta"></p>
    <button id="ack" type="button">확인</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
